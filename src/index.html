<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/calculator.css" />
  </head>
  <body>
    <main class="calculator">
      <output class="display" aria-label="Result">0</output>

      <section class="keypad" aria-label="Keypad">
        <button type="button" class="key" data-key="clear-all">
          <span aria-hidden="true">AC</span><span class="visually-hidden">Clear all</span>
        </button>
        <button type="button" class="key" data-key="clear-entry">
          <span aria-hidden="true">C</span><span class="visually-hidden">Clear entry</span>
        </button>
        <button type="button" class="key" data-key="toggle-sign">
          <span aria-hidden="true">&plusmn;</span><span class="visually-hidden">Toggle sign</span>
        </button>
        <button type="button" class="key key-operator" data-key="divide">
          <span aria-hidden="true">&divide;</span><span class="visually-hidden">Divide</span>
        </button>

        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key-operator" data-key="multiply">
          <span aria-hidden="true">&times;</span><span class="visually-hidden">Multiply</span>
        </button>

        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key-operator" data-key="subtract">
          <span aria-hidden="true">&minus;</span><span class="visually-hidden">Subtract</span>
        </button>

        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key-operator" data-key="add">
          <span aria-hidden="true">+</span><span class="visually-hidden">Add</span>
        </button>

        <button type="button" class="key key-zero" data-key="0">0</button>
        <button type="button" class="key" data-key="decimal">
          <span aria-hidden="true">.</span><span class="visually-hidden">Decimal point</span>
        </button>
        <button type="button" class="key key-operator" data-key="equals">
          <span aria-hidden="true">=</span><span class="visually-hidden">Equals</span>
        </button>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
